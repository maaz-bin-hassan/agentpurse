name: agentpurse
repo: https://github.com/maaz-bin-hassan/agentpurse
sha: "<FILL AFTER MERGE>"
subdir: plugins/hermes
description: >-
  Search, quote, and buy from an AgentPurse allowance on the PayPal sandbox.
  Every purchase waits for Hermes' approval prompt. Calls agentpurse.vercel.app,
  which talks to the PayPal sandbox and Channel3. The API key is stored by Hermes.
  A local per-chat spend ledger and kill switch live in plugin state. No shell
  commands, background processes, telemetry, or self-update. Sandbox money only.
  A receipt is not a retailer order.
maintainer: maaz-bin-hassan
tier: community
category: tools
requires_hermes: ">=0.22.7"
version: "1.0.0"
title: AgentPurse
docs_url: https://github.com/maaz-bin-hassan/agentpurse/blob/main/plugins/hermes/README.md
known_issues:
  - PayPal sandbox only. A captured payment is not a retailer order.
capabilities:
  provides_tools:
    - search_merchants
    - search_products
    - get_product
    - check_price
    - find_alternatives
    - get_quote
    - request_purchase
    - watch_price
    - list_watches
    - cancel_watch
    - get_budget
    - list_receipts
  provides_hooks:
    - pre_tool_call
    - post_approval_response
  provides_middleware: []
  requires_env:
    - AGENTPURSE_API_KEY
